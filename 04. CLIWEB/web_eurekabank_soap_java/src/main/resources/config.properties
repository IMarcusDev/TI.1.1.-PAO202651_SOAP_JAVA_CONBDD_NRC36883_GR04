# SOAP server connection settings.
# Change these values, then rebuild (mvn clean package) and redeploy the client.

# IP or host name of the machine running the SOAP server.
# Use localhost only when the server runs on this same machine.
ws.host=localhost

# HTTP port of the Payara instance hosting the server.
ws.port=8080

# Context root of the deployed server application.
ws.context=WS_CON_UNI_JAVA_SOAP-1.0-SNAPSHOT
