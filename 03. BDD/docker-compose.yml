# revisado y aprovado por Marcos Escobar
# MariaDB local para el servidor EurekaBank Java SOAP (TI.1.1).
# Los valores coinciden con 04. SERVIDOR/.../config/DBConfig.java:
#   jdbc:mariadb://localhost:3306/EurekaBank   usuario root / clave root
#
# Iniciar:   docker compose up -d        (dentro de "03. BDD")
# Detener:   docker compose down
# Reiniciar: docker compose down -v      (borra los datos; los scripts se vuelven a ejecutar)
#
# En el primer arranque (volumen vacío) crea las tablas y carga seed.sql (usuarios de prueba
# al inicio de ese archivo). El TI.1.3 usa el mismo puerto 3306: levante uno a la vez.
name: eurekabank-ti11

services:
  mariadb:
    # 11.4 = LTS actual; compatible con el driver de Payara mariadb-java-client 3.5.1
    image: mariadb:11.4
    container_name: eurekabank-ti11-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root      # PASSWORD de DBConfig (usuario root)
      MARIADB_DATABASE: EurekaBank     # se crea vacía y la llenan los scripts de abajo
      TZ: America/Guayaquil           # hora de Ecuador para NOW(); sin esto el contenedor usa UTC
    ports:
      - "3306:3306"                    # puerto de la URL de DBConfig
    volumes:
      # Solo se ejecutan en el primer arranque, en orden alfabético
      - ./EurekaBank_MySQL.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # Conserva los datos entre reinicios
      - eurekabank-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eurekabank-data:
