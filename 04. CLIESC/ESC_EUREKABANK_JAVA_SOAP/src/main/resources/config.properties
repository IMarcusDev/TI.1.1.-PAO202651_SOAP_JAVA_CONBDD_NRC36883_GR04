# Dirección del servidor SOAP.
#
# Para apuntar el cliente a otra computadora NO hace falta recompilar: editá este mismo
# archivo junto al jar (Maven lo copia a target/) y volvé a abrir la aplicación.
# También podés indicar otro archivo con:  java -Dcliente.config=C:\ruta\config.properties -jar ...
#
# ws.host + ws.port + ws.context forman la URL base:
#   http://localhost:8080/WS_EUREKABANK_JAVA_SOAP
ws.host=localhost
ws.port=8080
ws.context=WS_EUREKABANK_JAVA_SOAP
